services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: interview_pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pilot:pilot@db:5432/interview_pilot
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
